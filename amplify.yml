# Monorepo build spec — must live at REPOSITORY ROOT so Amplify picks it up.
# appRoot must match AMPLIFY_MONOREPO_APP_ROOT (e.g. frontend-react).
# See: https://docs.aws.amazon.com/amplify/latest/userguide/monorepo-configuration.html
version: 1
applications:
  - appRoot: frontend-react
    # Vite reads VITE_* at build time (.env is gitignored; Amplify sets this here).
    env:
      variables:
        VITE_API_BASE_URL: https://wd3lx1lbd2.execute-api.us-east-1.amazonaws.com
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
