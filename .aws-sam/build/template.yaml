AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "DayFlow AI \u2014 FastAPI on AWS Lambda + API Gateway HTTP API, fronting\
  \ Cognito and DynamoDB.\n"
Parameters:
  CognitoUserPoolId:
    Type: String
    Description: Your existing Cognito User Pool ID (e.g. us-east-1_abc123)
  CognitoClientId:
    Type: String
    Description: App client ID from your Cognito User Pool
  EventsTableName:
    Type: String
    Default: dayflow-events
    Description: DynamoDB table that stores events
  UsersTableName:
    Type: String
    Default: dayflow-users
    Description: DynamoDB table that stores user preferences
  WeatherApiKey:
    Type: String
    Default: none
    Description: OpenWeatherMap API key, or "none" to use the deterministic stub
  CorsOrigins:
    Type: String
    Default: http://localhost:5173,http://localhost:3000
    Description: Comma-separated list of allowed CORS origins
Globals:
  Function:
    Runtime: python3.10
    Timeout: 30
    MemorySize: 512
    Architectures:
    - x86_64
    Tracing: Active
Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: Public HTTPS frontdoor for the DayFlow API
      CorsConfiguration:
        AllowOrigins:
        - '*'
        AllowHeaders:
        - '*'
        AllowMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dayflow-api
      Description: FastAPI app (wrapped by Mangum) handling all DayFlow API routes
      CodeUri: ApiFunction
      Handler: lambda_handler.handler
      Environment:
        Variables:
          COGNITO_USER_POOL_ID:
            Ref: CognitoUserPoolId
          COGNITO_CLIENT_ID:
            Ref: CognitoClientId
          DYNAMO_EVENTS_TABLE:
            Ref: EventsTableName
          DYNAMO_USERS_TABLE:
            Ref: UsersTableName
          WEATHER_API_KEY:
            Ref: WeatherApiKey
          CORS_ORIGINS:
            Ref: CorsOrigins
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: EventsTableName
      - DynamoDBCrudPolicy:
          TableName:
            Ref: UsersTableName
      - Statement:
        - Effect: Allow
          Action:
          - cognito-idp:AdminGetUser
          - cognito-idp:AdminUpdateUserAttributes
          - cognito-idp:ListUsers
          Resource:
            Fn::Sub: arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
      - Statement:
        - Effect: Allow
          Action:
          - bedrock:InvokeModel
          Resource:
          - Fn::Sub: arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-*
          - Fn::Sub: arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-5-haiku-*
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: python3.10
      SamResourceId: ApiFunction
Outputs:
  ApiUrl:
    Description: Base URL of the deployed DayFlow API
    Value:
      Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-ApiUrl
  FunctionName:
    Description: Lambda function name (useful for tail-logging)
    Value:
      Ref: ApiFunction
  FunctionArn:
    Description: Lambda function ARN
    Value:
      Fn::GetAtt:
      - ApiFunction
      - Arn
  LogGroup:
    Description: CloudWatch log group for tailing
    Value:
      Fn::Sub: /aws/lambda/${ApiFunction}
