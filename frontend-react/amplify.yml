# AWS Amplify Hosting build spec — run with App root set to frontend-react/
# Console: Hosting → Environment variables → VITE_API_BASE_URL = https://YOUR_API.execute-api....
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
