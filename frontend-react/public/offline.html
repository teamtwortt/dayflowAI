<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DayFlow AI — Offline</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: #f2ede4;
        color: #1a1208;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1a1208; color: #f0e6d6; }
      }
      .badge {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: rgba(200, 121, 65, 0.15);
        color: #c87941;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1rem;
        font-size: 1.5rem;
      }
      h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
      p { font-size: 0.9rem; color: #7a6652; max-width: 24rem; margin: 0 auto 1.25rem; }
      @media (prefers-color-scheme: dark) {
        p { color: #9e8a77; }
      }
      a {
        display: inline-block;
        background: #c87941;
        color: white;
        padding: 0.6rem 1.2rem;
        border-radius: 0.75rem;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="badge">⚡</div>
      <h1>You're offline</h1>
      <p>DayFlow AI can't reach the network right now. Reconnect and we'll pick up where you left off.</p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
