<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayFlow AI — Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f2ede4;
            color: #1a1208;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ece4d4;
            border: 0.5px solid #d4c4a8;
            border-radius: 22px;
            padding: 2.5rem;
            width: 100%; max-width: 380px;
            margin: 1rem;
        }
        .logo-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.4rem; }
        .logo-icon {
            width: 34px; height: 34px; border-radius: 50%;
            border: 2px solid #c87941;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; color: #c87941;
        }
        .logo-text { font-size: 1.4rem; font-weight: 700; color: #1a1208; }
        .logo-text span { color: #c87941; }
        .subtitle { font-size: 0.85rem; color: #7a6652; margin-bottom: 2rem; }
        .tabs {
            display: flex; background: #f2ede4;
            border-radius: 12px; padding: 3px; margin-bottom: 1.25rem;
        }
        .tab {
            flex: 1; padding: 0.5rem; border: none; background: none;
            color: #7a6652; cursor: pointer; border-radius: 10px;
            font-size: 0.9rem; font-weight: 500; transition: all 0.2s;
        }
        .tab.active { background: #c87941; color: white; }
        input {
            width: 100%; padding: 0.75rem 1rem;
            background: #f2ede4; border: 0.5px solid #c4a882;
            border-radius: 12px; color: #1a1208;
            font-size: 0.95rem; margin-bottom: 0.85rem;
            outline: none; transition: border 0.2s;
        }
        input:focus { border-color: #c87941; }
        input::placeholder { color: #b09a82; }
        .primary {
            width: 100%; padding: 0.8rem;
            background: #c87941; border: none; border-radius: 12px;
            color: white; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; transition: background 0.2s;
        }
        .primary:hover { background: #b06a30; }
        .message {
            margin-top: 0.85rem; padding: 0.7rem 1rem;
            border-radius: 10px; font-size: 0.85rem; display: none;
        }
        .message.error   { background: #f5d5c0; color: #7a2e1a; }
        .message.success { background: #d0e8c8; color: #2a5a1a; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-row">
            <div class="logo-icon">&#9675;</div>
            <div class="logo-text">DayFlow<span>AI</span></div>
        </div>
        <p class="subtitle">Your personal productivity assistant</p>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('login')">Login</button>
            <button class="tab" onclick="switchTab('register')">Register</button>
        </div>

        <input type="email"    id="email"    placeholder="Email address" />
        <input type="password" id="password" placeholder="Password" />
        <button class="primary" onclick="handleSubmit()">Continue</button>

        <div class="message" id="message"></div>
    </div>

    <script src="js/api.js"></script>
    <script>
        let currentTab = "login";

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll(".tab").forEach((t, i) => {
                t.classList.toggle("active",
                    (i === 0 && tab === "login") || (i === 1 && tab === "register"));
            });
            showMessage("", "");
        }

        function showMessage(text, type) {
            const el = document.getElementById("message");
            el.textContent = text;
            el.className = `message ${type}`;
            el.style.display = text ? "block" : "none";
        }

        async function handleSubmit() {
            const email    = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            if (!email || !password) { showMessage("Please fill in all fields", "error"); return; }
            if (currentTab === "register") {
                const data = await register(email, password);
                if (data.message) { showMessage("Registered! Please log in.", "success"); switchTab("login"); }
                else showMessage(data.error || "Registration failed", "error");
            } else {
                const data = await login(email, password);
                if (data.token) window.location.href = "dashboard.html";
                else showMessage(data.error || "Login failed", "error");
            }
        }

        document.addEventListener("keydown", e => { if (e.key === "Enter") handleSubmit(); });
    </script>
</body>
</html>
