name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'frontend-react/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend-react
          npm install

      - name: Build
        run: |
          cd frontend-react
          npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Notify success
        run: echo "Frontend build passed — Amplify auto-deploys from main"